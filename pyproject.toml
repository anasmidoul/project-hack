[project]
name = "housia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "browser-use==1.0.6",
    "flask>=3.1.3",
    "openai>=3.57.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
